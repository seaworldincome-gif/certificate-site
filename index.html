
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شهادة شكر وتقدير</title>

<style>
body {
  margin: 0;
  padding: 20px;
  background: #f3eee2;
  font-family: Tahoma, Arial, sans-serif;
  text-align: center;
}

h2 {
  color: #075c35;
}

.container {
  max-width: 950px;
  margin: auto;
  background: white;
  padding: 15px;
  border-radius: 12px;
}

input {
  width: 85%;
  max-width: 500px;
  padding: 14px;
  font-size: 18px;
  margin: 12px;
  border: 1px solid #aaa;
  border-radius: 8px;
  text-align: center;
}

button {
  padding: 13px 20px;
  margin: 7px;
  border: none;
  border-radius: 8px;
  background: #075c35;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.preview {
  position: relative;
  width: 100%;
  margin-top: 15px;
}

.preview img {
  width: 100%;
  display: block;
}

#namePreview {
  position: absolute;
  left: 33.3%;
  top: 84.1%;
  width: 38%;
  height: 8.7%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(10px, 2.25vw, 27px);
  font-weight: bold;
  color: #21190f;
  white-space: nowrap;
  overflow: hidden;
}
</style>
</head>

<body>

<div class="container">

<h2>شهادة شكر وتقدير</h2>

<p>اكتب اسمك للحصول على شهادة خاصة بك</p>

<input
  type="text"
  id="personName"
  placeholder="اكتب الاسم بالكامل هنا"
  maxlength="48"
>

<br>

<button onclick="downloadCertificate()">
تحميل الشهادة PNG
</button>

<button onclick="printCertificate()">
طباعة الشهادة
</button>

<div class="preview">
  <img id="certificate" src="certificate.jpg"
       alt="شهادة شكر وتقدير">
  <div id="namePreview">الاسم يظهر هنا</div>
</div>

</div>

<script>
const input = document.getElementById("personName");
const preview = document.getElementById("namePreview");
const img = document.getElementById("certificate");

input.addEventListener("input", function() {
  preview.textContent = input.value || "الاسم يظهر هنا";
});

function makeCertificate() {
  if (!input.value.trim()) {
    alert("من فضلك اكتب الاسم أولاً");
    input.focus();
    return null;
  }

  const canvas = document.createElement("canvas");
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;

  const ctx = canvas.getContext("2d");
  ctx.drawImage(img, 0, 0);

  let size = 46;
  const name = input.value.trim();
  const maxWidth = canvas.width * 0.36;

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.direction = "rtl";
  ctx.fillStyle = "#21190f";

  ctx.font = "bold " + size + "px Tahoma";

  while (ctx.measureText(name).width > maxWidth && size > 18) {
    size--;
    ctx.font = "bold " + size + "px Tahoma";
  }

  ctx.fillText(
    name,
    canvas.width * 0.523,
    canvas.height * 0.868,
    maxWidth
  );

  return canvas;
}

function downloadCertificate() {
  if (!img.complete || !img.naturalWidth) {
    alert("صورة الشهادة لم يتم تحميلها");
    return;
  }

  const canvas = makeCertificate();
  if (!canvas) return;

  const link = document.createElement("a");
  link.download = "شهادة-شكر-وتقدير.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
}

function printCertificate() {
  if (!img.complete || !img.naturalWidth) {
    alert("صورة الشهادة لم يتم تحميلها");
    return;
  }

  const canvas = makeCertificate();
  if (!canvas) return;

  const win = window.open("", "_blank");
  if (!win) {
    alert("يرجى السماح بفتح النوافذ المنبثقة للطباعة");
    return;
  }

  const data = canvas.toDataURL("image/png");

  win.document.write(`
    <html>
    <head>
    <title>طباعة الشهادة</title>
    <style>
      @page { size: A4 landscape; margin: 0; }
      body { margin: 0; }
      img { width: 100%; height: 100vh; object-fit: contain; }
    </style>
    </head>
    <body>
    <img src="${data}">
    <script>
      window.onload = function() { window.print(); };
    <\/script>
    </body>
    </html>
  `);

  win.document.close();
}
</script>

</body>
</html>
